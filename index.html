<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#123c32">
<title>Contador de Billetes</title>
<style>
:root{font-family:Arial,sans-serif;color:#17231f;background:#f3f6f4}*{box-sizing:border-box}
body{margin:0;padding:16px;max-width:720px;margin:auto}
header{background:#123c32;color:white;padding:20px;border-radius:18px;margin-bottom:14px}
h1{font-size:24px;margin:0 0 6px}p{margin:5px 0;color:inherit;opacity:.85}
.total{background:#e0f4e8;border:1px solid #b7e1c7;border-radius:18px;padding:18px;margin-bottom:16px}
.total small{font-weight:bold;color:#426354}.amount{font-size:34px;font-weight:800;margin:7px 0;color:#0b6842;overflow-wrap:anywhere}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.item{background:white;border:1px solid #dce5df;border-radius:13px;padding:12px}
.denom{font-weight:bold;margin-bottom:8px}.item input{width:100%;padding:12px;border:1px solid #cbd8d0;border-radius:9px;font-size:18px}
.sub{font-size:13px;color:#486356;margin-top:8px}.sub b{color:#147247}
button{border:0;border-radius:11px;padding:13px 12px;font-size:15px;font-weight:bold;cursor:pointer}
.primary{background:#145c45;color:white}.secondary{background:#e1e9e4;color:#1c382d}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:14px 0}
section{background:white;border:1px solid #dce5df;border-radius:15px;padding:15px;margin-top:16px}
h2{font-size:18px;margin:0 0 12px}.entry{padding:10px 0;border-bottom:1px solid #e7ece8}.entry:last-child{border-bottom:0}
.entry strong{display:block}.entry small{color:#64756c}.entry button{padding:7px 9px;margin-top:7px;font-size:12px}
.muted{color:#63736b;font-size:13px}.empty{color:#68786f;font-size:14px}
@media(max-width:360px){body{padding:10px}.amount{font-size:29px}.grid{gap:7px}.item{padding:9px}}
</style>
</head>
<body>
<header><h1>🧮 Contador de Billetes</h1><p>Introduce cuántos billetes tienes de cada valor.</p></header>
<div class="total"><small>TOTAL GENERAL</small><div class="amount" id="total">0</div><div id="pieces">0 billetes</div></div>
<div class="grid" id="grid"></div>
<div class="actions">
<button class="primary" id="save">Guardar conteo</button>
<button class="secondary" id="clear">Nuevo conteo</button>
</div>
<div class="actions">
<button class="secondary" id="copy">Copiar resumen</button>
<button class="secondary" id="share">Compartir</button>
</div>
<section><h2>Historial de conteos</h2><div id="history" class="empty">Todavía no hay conteos guardados.</div><p class="muted">El historial se guarda en este teléfono.</p></section>
<script>
const denoms=[1,3,5,10,20,50,100,200,500,1000,2000,5000,10000,20000];
const fmt=n=>Math.round(n).toLocaleString('es-ES');
const vals={}; denoms.forEach(d=>vals[d]=0);
const grid=document.getElementById('grid');
denoms.forEach(d=>{
 const div=document.createElement('div');div.className='item';
 div.innerHTML=`<div class="denom">Billetes de ${fmt(d)}</div><input type="number" min="0" step="1" inputmode="numeric" aria-label="Cantidad de billetes de ${d}" placeholder="Cantidad" id="n${d}"><div class="sub">Subtotal: <b id="s${d}">0</b></div>`;
 grid.appendChild(div);
 document.getElementById('n'+d).addEventListener('input',e=>{vals[d]=Math.max(0,Math.floor(Number(e.target.value)||0));update()});
});
function update(){let total=0,pieces=0;denoms.forEach(d=>{let q=vals[d]||0;total+=d*q;pieces+=q;document.getElementById('s'+d).textContent=fmt(d*q)});document.getElementById('total').textContent=fmt(total);document.getElementById('pieces').textContent=fmt(pieces)+' billetes';}
function summary(){return 'CONTEO DE BILLETES\n'+denoms.filter(d=>vals[d]>0).map(d=>`${fmt(d)} × ${fmt(vals[d])} = ${fmt(d*vals[d])}`).join('\n')+'\nTOTAL: '+document.getElementById('total').textContent+'\nBilletes: '+document.getElementById('pieces').textContent}
function getHistory(){try{return JSON.parse(localStorage.getItem('billetes_historial')||'[]')}catch(e){return []}}
function renderHistory(){let h=getHistory(),el=document.getElementById('history');if(!h.length){el.className='empty';el.textContent='Todavía no hay conteos guardados.';return}el.className='';el.innerHTML='';h.forEach((x,i)=>{let row=document.createElement('div');row.className='entry';let strong=document.createElement('strong');strong.textContent=x.total+' — '+x.date;let small=document.createElement('small');small.textContent=x.pieces+' billetes';let load=document.createElement('button');load.className='secondary';load.textContent='Cargar';load.onclick=()=>{denoms.forEach(d=>{vals[d]=x.vals[d]||0;document.getElementById('n'+d).value=vals[d]||''});update();window.scrollTo({top:0,behavior:'smooth'})};let del=document.createElement('button');del.className='secondary';del.textContent='Eliminar';del.style.marginLeft='6px';del.onclick=()=>{let a=getHistory();a.splice(i,1);localStorage.setItem('billetes_historial',JSON.stringify(a));renderHistory()};row.append(strong,small,document.createElement('br'),load,del);el.appendChild(row)})}
document.getElementById('save').onclick=()=>{let h=getHistory(),pieces=denoms.reduce((s,d)=>s+vals[d],0);h.unshift({date:new Date().toLocaleString('es-ES'),total:document.getElementById('total').textContent,pieces,vals:{...vals}});localStorage.setItem('billetes_historial',JSON.stringify(h.slice(0,100)));renderHistory();alert('Conteo guardado en el historial.')};
document.getElementById('clear').onclick=()=>{if(confirm('¿Borrar las cantidades actuales? El historial se conservará.')){denoms.forEach(d=>{vals[d]=0;document.getElementById('n'+d).value=''});update()}};
document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(summary());alert('Resumen copiado.')}catch(e){prompt('Copia el resumen:',summary())}};
document.getElementById('share').onclick=async()=>{if(navigator.share){try{await navigator.share({title:'Conteo de billetes',text:summary()})}catch(e){}}else{try{await navigator.clipboard.writeText(summary());alert('Resumen copiado para compartir.')}catch(e){prompt('Copia el resumen:',summary())}}};
renderHistory();update();
</script>
</body></html>
